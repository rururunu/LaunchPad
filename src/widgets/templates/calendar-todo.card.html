<div class="app">
  <div class="head">
    <div class="date">
      <div class="num" id="dayNum">-</div>
      <div class="meta"><span id="monthTxt">-</span><span id="weekTxt">-</span></div>
    </div>
    <span class="badge" id="badge">0</span>
  </div>
  <div class="list" id="list"></div>
</div>
<style>
  .app { --bg:#fff; --bg3:#e5e5ea; --text:#1d1d1f; --sub:#86868b; --accent:#007aff;
    height:100vh; padding:16px; display:flex; flex-direction:column; gap:10px; overflow:hidden;
    background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"PingFang SC",sans-serif; container-type:inline-size; }
  @media (prefers-color-scheme: dark) { .app { --bg:#1c1c1e; --bg3:#3a3a3c; --text:#f5f5f7; --sub:#98989d; --accent:#0a84ff; } }
  .head { display:flex; justify-content:space-between; align-items:flex-start; flex:none; }
  .date { display:flex; align-items:center; gap:10px; }
  .num { font-size:36px; font-weight:700; line-height:1; letter-spacing:-1.5px; font-variant-numeric:tabular-nums; }
  .meta { display:flex; flex-direction:column; font-size:12px; line-height:1.3; color:var(--sub); font-weight:500; }
  .badge { min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:var(--accent); color:#fff; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center; }
  .badge.zero { background:var(--bg3); color:var(--sub); }
  .list { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:2px; scrollbar-width:none; }
  .item { display:flex; align-items:center; gap:10px; padding:5px 0; }
  .check { width:16px; height:16px; border-radius:50%; border:1.5px solid var(--sub); flex:none; position:relative; }
  .item.done .check { background:var(--accent); border-color:var(--accent); }
  .item.done .check::after { content:""; position:absolute; left:3.5px; top:3px; width:6px; height:3px; border-left:1.5px solid #fff; border-bottom:1.5px solid #fff; transform:rotate(-45deg); }
  .txt { font-size:13px; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item.done .txt { color:var(--sub); text-decoration:line-through; }
  .empty { flex:1; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:13px; }
  @container (max-width:180px) { .num { font-size:28px; } .app { padding:12px; } }
</style>
<script>
  var WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
  var db = {};
  function ymd(d) { var m = d.getMonth() + 1, day = d.getDate(); return d.getFullYear() + "-" + (m < 10 ? "0" + m : m) + "-" + (day < 10 ? "0" + day : day); }
  function $(id) { return document.getElementById(id); }
  function render() {
    var now = new Date(), tasks = db[ymd(now)] || [];
    $("dayNum").textContent = now.getDate();
    $("monthTxt").textContent = (now.getMonth() + 1) + "月";
    $("weekTxt").textContent = WEEK[now.getDay()];
    var undone = tasks.filter(function (t) { return !t.done; }).length;
    $("badge").textContent = undone;
    $("badge").className = undone ? "badge" : "badge zero";
    var list = $("list");
    list.textContent = "";
    if (!tasks.length) { var e = document.createElement("div"); e.className = "empty"; e.textContent = "今天暂无事务"; list.appendChild(e); return; }
    tasks.forEach(function (t) {
      var row = document.createElement("div"); row.className = "item" + (t.done ? " done" : "");
      var c = document.createElement("div"); c.className = "check";
      var x = document.createElement("div"); x.className = "txt"; x.textContent = t.text;
      row.appendChild(c); row.appendChild(x); list.appendChild(row);
    });
  }
  lp.get("tasks").then(function (v) {
    if (v && typeof v === "object") db = v;
    else { db[ymd(new Date())] = [{ id: 1, text: "点击卡片打开日历", done: false }, { id: 2, text: "在日历里添加你的事务", done: false }]; lp.set("tasks", db); }
    render();
  }).catch(render);
  lp.onChange(function (k, v) { if (k === "tasks") { db = v || {}; render(); } });
  setInterval(render, 60000);
  render();
</script>
